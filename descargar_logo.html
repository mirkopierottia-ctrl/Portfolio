<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generador de Logo para Fiverr</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap');
        
        body { 
            background: #111111; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .container {
            text-align: center;
            background: #1a1a1a;
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid #333;
        }

        h1 { margin-top: 0; margin-bottom: 0.5rem; }
        p { color: #888; margin-bottom: 2rem; }

        canvas { 
            border-radius: 50%; /* Fiverr uses circular crops */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 300px; 
            max-height: 300px; 
            margin-bottom: 2rem;
            background: #050505;
        }
        
        button { 
            padding: 1rem 2.5rem; 
            font-size: 1.1rem; 
            font-weight: 800; 
            background: #00FF9D; 
            color: #050505; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 157, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tu Logo para Fiverr</h1>
        <p>Resolución 2000x2000 (Alta Calidad)</p>
        
        <canvas id="logoCanvas" width="2000" height="2000"></canvas>
        <br>
        <button onclick="downloadLogo()">Descargar PNG en Alta Calidad</button>
    </div>

    <script>
        window.onload = () => {
            // Asegurarnos de que la fuente 'Inter' cargue antes de dibujar
            document.fonts.ready.then(() => {
                const canvas = document.getElementById('logoCanvas');
                const ctx = canvas.getContext('2d');
                
                // Fondo oscuro premium
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Configuraciones de tipografía
                ctx.font = '800 1200px "Inter", sans-serif';
                ctx.textBaseline = 'middle';
                
                // Textos a dibujar
                const textM = "M";
                const textDot = ".";
                
                // Medir para centrar perfectamente todo el bloque "M."
                const mWidth = ctx.measureText(textM).width;
                const dotWidth = ctx.measureText(textDot).width;
                const totalWidth = mWidth + dotWidth;
                
                // Calcular el punto de inicio en X
                // Se resta un poquito de ajuste visual por el padding intrínseco de la fuente
                const startX = (canvas.width - totalWidth) / 2 - 40; 
                
                // Calcular el punto Y (ligeramente ajustado hacia arriba por balance óptico)
                const startY = canvas.height / 2 + 100;
                
                // Dibujar la "M" (Blanco)
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'left';
                ctx.fillText(textM, startX, startY);
                
                // Dibujar el punto "." (Verde Neón)
                ctx.fillStyle = '#00FF9D';
                ctx.fillText(textDot, startX + mWidth, startY);
            });
        };

        function downloadLogo() {
            const canvas = document.getElementById('logoCanvas');
            const link = document.createElement('a');
            link.download = 'M_Logo_Fiverr.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
